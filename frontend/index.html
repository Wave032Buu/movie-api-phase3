<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Management System - Phase 3</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
  <div class="max-w-5xl mx-auto">
    <!-- Header -->
    <header class="mb-8 border-b border-slate-700 pb-4 flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-bold text-indigo-400">🎬 Movie API Client</h1>
        <p class="text-slate-400 text-sm mt-1">ระบบจัดการข้อมูลภาพยนตร์และเชื่อมต่อ External API / Microservices (Phase 3)</p>
      </div>
      <button onclick="fetchMovies()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm transition">
        🔄 รีเฟรชข้อมูล
      </button>
    </header>

    <!-- กล่องแสดงสถานะ Loading / Error / Success -->
    <div id="statusBox" class="hidden mb-6 p-4 rounded-lg font-medium"></div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- ส่วนที่ 1: แบบฟอร์มเพิ่มภาพยนตร์ (POST /api/movies) -->
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 h-fit">
        <h2 class="text-xl font-semibold mb-4 text-emerald-400">➕ เพิ่มภาพยนตร์ใหม่</h2>
        <form id="movieForm" onsubmit="handleCreateMovie(event)" novalidate>
          <div class="mb-4">
            <label class="block text-sm text-slate-300 mb-1">ชื่อภาพยนตร์ (Title) *</label>
            <input type="text" id="title" placeholder="เช่น Oppenheimer" 
              class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500" />
            <p id="titleError" class="text-red-400 text-xs mt-1 hidden"></p>
          </div>

          <div class="mb-4">
            <label class="block text-sm text-slate-300 mb-1">ปีที่ฉาย (Release Year) *</label>
            <input type="number" id="release_year" placeholder="เช่น 2023" 
              class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500" />
            <p id="yearError" class="text-red-400 text-xs mt-1 hidden"></p>
          </div>

          <div class="mb-4">
            <label class="block text-sm text-slate-300 mb-1">รหัสผู้กำกับ (Director ID)</label>
            <input type="number" id="director_id" value="1" 
              class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500" />
          </div>

          <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg transition">
            บันทึกภาพยนตร์
          </button>
        </form>
      </div>

      <!-- ส่วนที่ 2: รายการภาพยนตร์ (GET /api/movies & DELETE /api/movies/:id) -->
      <div class="md:col-span-2 bg-slate-800 p-5 rounded-xl border border-slate-700">
        <h2 class="text-xl font-semibold mb-4 text-indigo-300">📋 รายชื่อภาพยนตร์ในระบบ</h2>
        
        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="hidden py-8 text-center text-slate-400">
          <div class="animate-spin inline-block w-8 h-8 border-4 border-indigo-400 border-t-transparent rounded-full mb-2"></div>
          <p>กำลังดึงข้อมูลจากเซิร์ฟเวอร์...</p>
        </div>

        <div id="movieList" class="space-y-3"></div>
      </div>
    </div>

    <!-- ส่วนที่ 3: Modal/Panel แสดงรายละเอียดเชิงลึกจาก OMDB External API (GET /api/movies/:id) -->
    <div id="detailPanel" class="hidden mt-6 bg-slate-800 p-5 rounded-xl border border-indigo-500/50">
      <div class="flex justify-between items-start">
        <h3 class="text-lg font-bold text-indigo-400" id="detailTitle">รายละเอียดภาพยนตร์</h3>
        <button onclick="document.getElementById('detailPanel').classList.add('hidden')" class="text-slate-400 hover:text-white">✖ ปิด</button>
      </div>
      <div id="detailContent" class="mt-3 text-sm text-slate-300 space-y-2"></div>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:3000/api";

    // ฟังก์ชันแสดงแจ้งเตือนสถานะ (Error / Success)
    function showStatus(message, type = "info") {
      const box = document.getElementById("statusBox");
      box.className = "mb-6 p-4 rounded-lg font-medium block ";
      if (type === "error") box.className += "bg-red-900/60 border border-red-500 text-red-200";
      else if (type === "success") box.className += "bg-emerald-900/60 border border-emerald-500 text-emerald-200";
      else box.className += "bg-indigo-900/60 border border-indigo-500 text-indigo-200";
      box.innerText = message;
    }

    // 1. Endpoint ที่ 1: GET /api/movies
    async function fetchMovies() {
      const listEl = document.getElementById("movieList");
      const loadingEl = document.getElementById("loadingIndicator");
      
      listEl.innerHTML = "";
      loadingEl.classList.remove("hidden");

      try {
        const res = await fetch(`${API_BASE}/movies`);
        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
        const json = await res.json();
        const movies = json.data || [];

        if (movies.length === 0) {
          listEl.innerHTML = `<p class="text-slate-400 text-center py-6">ยังไม่มีข้อมูลภาพยนตร์ในระบบ</p>`;
        } else {
          movies.forEach(movie => {
            const item = document.createElement("div");
            item.className = "flex justify-between items-center bg-slate-900 p-4 rounded-lg border border-slate-700";
            item.innerHTML = `
              <div>
                <h3 class="font-bold text-lg text-white">${movie.title} <span class="text-sm font-normal text-slate-400">(${movie.release_year})</span></h3>
                <p class="text-xs text-slate-400">ผู้กำกับ: ${movie.director_name || "ไม่ระบุ (ID: 1)"}</p>
              </div>
              <div class="flex gap-2">
                <button onclick="viewMovieDetail(${movie.id})" class="bg-indigo-600/80 hover:bg-indigo-600 px-3 py-1.5 rounded text-xs transition">
                  🔍 ดูรีวิว/เรื่องย่อ
                </button>
                <button onclick="deleteMovie(${movie.id})" class="bg-red-600/80 hover:bg-red-600 px-3 py-1.5 rounded text-xs transition">
                  🗑️ ลบ
                </button>
              </div>
            `;
            listEl.appendChild(item);
          });
        }
      } catch (err) {
        showStatus(`❌ ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ API ได้: ${err.message} (กรุณาตรวจสอบว่าเปิด npm run dev ที่พอร์ต 3000 แล้ว)`, "error");
      } finally {
        loadingEl.classList.add("hidden");
      }
    }

    // 2. Endpoint ที่ 2: POST /api/movies พร้อม Frontend Validation
    async function handleCreateMovie(event) {
      event.preventDefault();
      
      const titleInput = document.getElementById("title");
      const yearInput = document.getElementById("release_year");
      const directorInput = document.getElementById("director_id");
      const titleErr = document.getElementById("titleError");
      const yearErr = document.getElementById("yearError");

      // รีเซ็ตข้อความ Error
      titleErr.classList.add("hidden");
      yearErr.classList.add("hidden");

      const title = titleInput.value.trim();
      const release_year = Number(yearInput.value);
      const director_id = Number(directorInput.value) || 1;

      // ตรวจสอบความถูกต้องเบื้องต้นฝั่ง Frontend (Client-side Validation)
      let isValid = true;
      if (title.length < 2) {
        titleErr.innerText = "กรุณาระบุชื่อภาพยนตร์อย่างน้อย 2 ตัวอักษร";
        titleErr.classList.remove("hidden");
        isValid = false;
      }
      if (!release_year || release_year < 1888 || release_year > 2030) {
        yearErr.innerText = "กรุณาระบุปี ค.ศ. ที่ถูกต้อง (ระหว่าง 1888 - 2030)";
        yearErr.classList.remove("hidden");
        isValid = false;
      }
      if (!isValid) return;

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "กำลังบันทึก...";

      try {
        const res = await fetch(`${API_BASE}/movies`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, release_year, director_id })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "บันทึกข้อมูลไม่สำเร็จ");

        showStatus(`✅ เพิ่มภาพยนตร์ "${title}" สำเร็จแล้ว!`, "success");
        document.getElementById("movieForm").reset();
        document.getElementById("director_id").value = "1";
        fetchMovies();
      } catch (err) {
        showStatus(`❌ เกิดข้อผิดพลาดในการเพิ่มข้อมูล: ${err.message}`, "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "บันทึกภาพยนตร์";
      }
    }

    // 3. Endpoint ที่ 3: GET /api/movies/:id (เชื่อมต่อ External API & Fallback)
    async function viewMovieDetail(id) {
      const panel = document.getElementById("detailPanel");
      const content = document.getElementById("detailContent");
      panel.classList.remove("hidden");
      content.innerHTML = `<p class="text-indigo-300 animate-pulse">⏳ กำลังดึงข้อมูลจากฐานข้อมูลและ OMDB API (อาจใช้เวลาหากติด Retry/Timeout)...</p>`;

      try {
        const res = await fetch(`${API_BASE}/movies/${id}`);
        if (!res.ok) throw new Error("ไม่พบข้อมูลภาพยนตร์");
        const json = await res.json();
        const movie = json.data;

        document.getElementById("detailTitle").innerText = `🎬 ${movie.title} (${movie.release_year})`;
        content.innerHTML = `
          <p><strong>รหัสภาพยนตร์:</strong> ${movie.id}</p>
          <p><strong>คะแนน IMDb (External API):</strong> <span class="text-amber-400 font-semibold">${movie.external_info?.rating || "N/A"}</span></p>
          <p><strong>เรื่องย่อ (Plot / Fallback):</strong> ${movie.external_info?.plot || "-"}</p>
        `;
      } catch (err) {
        content.innerHTML = `<p class="text-red-400">❌ ดึงข้อมูลล้มเหลว: ${err.message}</p>`;
      }
    }

    // 4. Endpoint ที่ 4: DELETE /api/movies/:id
    async function deleteMovie(id) {
      if (!confirm(`ยืนยันการลบภาพยนตร์รหัส #${id} ?`)) return;

      try {
        const res = await fetch(`${API_BASE}/movies/${id}`, { method: "DELETE" });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "ลบข้อมูลไม่สำเร็จ");

        showStatus(`🗑️ ลบภาพยนตร์รหัส #${id} เรียบร้อยแล้ว`, "info");
        fetchMovies();
      } catch (err) {
        showStatus(`❌ ลบข้อมูลไม่สำเร็จ: ${err.message}`, "error");
      }
    }

    // โหลดข้อมูลครั้งแรกเมื่อเปิดหน้าเว็บ
    fetchMovies();
  </script>
</body>
</html>
